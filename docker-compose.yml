services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CTF_OS_ENVIRONMENT: development
      CTF_OS_DEBUG: "true"
      CTF_OS_LOG_LEVEL: INFO
      CTF_OS_DATABASE_URL: postgresql+asyncpg://ctfos:ctfos_dev_only@postgres:5432/ctfos
    ports:
      - "8000:8000"
    volumes:
      - ctf_artifacts:/app/backend/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      CTF_OS_ENVIRONMENT: development
      CTF_OS_DEBUG: "false"
      CTF_OS_LOG_LEVEL: INFO
      CTF_OS_DATABASE_URL: postgresql+asyncpg://ctfos:ctfos_dev_only@postgres:5432/ctfos
      CTF_OS_EXECUTION_MODE: direct
      CTF_OS_AUTO_INSTALL: "1"
      CTF_OS_COMMAND_TIMEOUT: "300"
      CTF_OS_SOLVER_MAX_STEPS: "48"
      CTF_OS_SOLVER_MAX_LINKS: "24"
    volumes:
      - ctf_artifacts:/app/backend/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ctfos
      POSTGRES_USER: ctfos
      POSTGRES_PASSWORD: ctfos_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctfos -d ctfos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  ctf_artifacts:
