name: backend

on:
  push:
    paths:
      - "backend/**"
      - "sdk/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "sdk/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ./sdk ./backend[dev]
      - name: Lint
        run: ruff check backend
      - name: Type check
        run: mypy backend/app
      - name: Test
        run: pytest backend/tests
